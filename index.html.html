<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d101a"><title>Math Gym — Brain Training</title><style>
:root{color-scheme:dark;--bg:#0d101a;--card:#1b2031;--muted:#adb5ca;--accent:#9664f8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#18202c 0,#0d101a 58%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}main{max-width:660px;margin:auto;padding:24px 18px 48px}.hero{position:relative;min-height:240px;display:flex;align-items:end;justify-content:center}.hero img{position:absolute;top:-24px;height:300px;max-width:95%;object-fit:contain;mix-blend-mode:screen;opacity:.9;mask-image:linear-gradient(to bottom,black 65%,transparent 100%)}.brain{position:absolute;top:42px;left:calc(50% + 4px);font-size:38px;filter:drop-shadow(0 0 12px #b889ff);animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.1)}}.card{position:relative;background:rgba(29,34,51,.95);border:1px solid #31384d;border-radius:30px;padding:26px 24px;box-shadow:0 18px 50px #0005}h1{font-size:clamp(32px,8vw,46px);margin:0 0 4px;letter-spacing:-1.5px}p{color:var(--muted);margin:0 0 22px;font-size:15px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}select,input{width:100%;background:#101420;border:1px solid #4b5570;color:white;border-radius:14px;padding:14px 12px;font-size:17px;outline:none}input:focus,select:focus{border-color:#aa80ff}.problem{text-align:center;padding:28px 0 15px;font-weight:750;font-size:clamp(38px,10vw,58px);letter-spacing:1px;font-variant-numeric:tabular-nums}.hint{text-align:center;color:#aab4c8;font-size:12px;margin-bottom:12px}.answer{font-size:24px;text-align:center;padding:16px}button{border:0;border-radius:15px;padding:17px;font-size:17px;font-weight:750;cursor:pointer;color:white;width:100%;background:var(--accent);margin-top:12px}button.secondary{background:#414c69}button:active{transform:scale(.99)}#feedback{text-align:center;min-height:25px;margin-top:12px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:24px;text-align:center}.stats strong{display:block;font-size:25px}.stats small{color:#b7bed0}.footer{text-align:center;color:#8e98ad;font-size:12px;margin-top:20px}@media(max-width:390px){.card{padding:22px 17px}.settings{gap:8px}select{font-size:15px}}@media(prefers-reduced-motion:reduce){.brain{animation:none}}
